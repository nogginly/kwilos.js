<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="color-scheme" content="light dark">
  <script>
    // Applies a theme chosen earlier before the page paints, so it does not flash
    try {
      const theme = localStorage.getItem('kwilos-theme')
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
    } catch { }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="site.js" defer></script>
</head>

<body>
  <header class="site-header">
    <a class="site-name" href="index.html">Kwilos.js</a>
    <nav aria-label="Site">
      <a href="index.html" {{nav_home}}>Home</a>
      <a href="api.html" {{nav_api}}>API</a>
      <a href="playground.html" {{nav_playground}}>Playground</a>
      <a href="https://github.com/nogginly/kwilos.js">GitHub</a>
      <a href="https://www.npmjs.com/package/kwilos.js">npm</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark themes">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
      </svg>
    </button>
  </header>

  <main>
{{content}}
  </main>

  <footer class="site-footer">
    <p>
      Kwilos.js {{version}} ·
      <a href="https://github.com/nogginly/kwilos.js/blob/v{{version}}/CHANGELOG.md">Changelog</a> ·
      <a href="https://github.com/nogginly/kwilos.js/blob/v{{version}}/LICENSE">MPL-2.0 licence</a>
    </p>
    <p>Sample graphics by <a href="https://kenney.nl">Kenney</a>.</p>
  </footer>
</body>

</html>
