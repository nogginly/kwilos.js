name: Pages

# Builds the web site and deploys it to GitHub Pages. The Publish workflow
# runs it after staging each release, and it can be run by hand from the
# Actions tab. The deploy waits for a reviewer's approval on the github-pages
# environment, and stops unless the site's version is on npm, so the
# samples' CDN imports resolve.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: package
        run: echo "package=$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the version is on npm
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          if ! npm view "$PACKAGE" version > /dev/null 2>&1; then
            echo "::error::$PACKAGE is not on npm yet; approve it there, then re-run this job"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v5
