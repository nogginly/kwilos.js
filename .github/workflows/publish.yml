name: Publish

# Publishes to npm when a version tag such as v0.8.0 is pushed, after the
# full CI checks pass. Uses npm trusted publishing, so no npm token is
# stored; the package's trusted publisher on npmjs.com must name this
# repository and this workflow file.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - name: Publish, unless this version is already on npm
        run: |
          package="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$package" version > /dev/null 2>&1; then
            echo "$package is already on npm; nothing to publish"
          else
            npm publish --provenance --access public
          fi
