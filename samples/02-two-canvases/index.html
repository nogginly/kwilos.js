<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two layered canvases</title>
  <meta name="description" content="Two canvases, each with its own Kwilos, one over the other; the upper one is partly transparent. Move the mouse over both.">
  <meta name="sample-size" content="500x400">
  <link rel="stylesheet" href="../sample.css">
  <style>
    /* The canvases are stacked in a box the size of their union, 500 by
       400: the lower canvas, 400 by 400, at its top left, and the upper,
       300 by 200, at (200, 100). Sizes and offsets are percentages of the
       box, so the pair shrinks together. */
    .layered {
      position: relative;
      width: min(100%, 500px);
      aspect-ratio: 500 / 400;
    }

    .layered canvas {
      position: absolute;
    }

    #under-canvas-02 {
      left: 0;
      top: 0;
      width: 80%;
    }

    #over-canvas-02 {
      left: 40%;
      top: 25%;
      width: 60%;
    }
  </style>

  <!-- Load the app as a module -->
  <script src="app.js" type="module"></script>
</head>

<body>
  <div class="layered">
    <canvas id="under-canvas-02" width="400" height="400"></canvas>
    <canvas id="over-canvas-02" width="300" height="200"></canvas>
  </div>
</body>

</html>
